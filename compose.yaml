services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ovcc
      POSTGRES_PASSWORD: ovcc_local
      POSTGRES_DB: ovcc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ovcc-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovcc -d ovcc"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  ovcc-data:
